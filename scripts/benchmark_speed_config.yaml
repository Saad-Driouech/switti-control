# ============================================================
# Inference speed benchmark config
# ============================================================
# Runs each model n_runs times (after n_warmup warm-up passes)
# with a single dummy prompt + control image (batch_size=1).
# All SWITTI runs use fp16; diffusers runs use fp16 where possible.
#
# Usage:
#   python scripts/benchmark_speed.py \
#       --config scripts/benchmark_speed_config.yaml \
#       --out_dir /path/to/bench_out/

# ---- Timing ----
n_warmup: 5
n_runs: 50

# ---- Shared generation settings ----
reso: 512
depth: 30
guidance: 6.0
top_k: 400
top_p: 0.95
control_end_si: 8
mid_reso: 1.125

# ---- Dummy input ----
prompt: "A high-quality photo of a dog in a park."

# ---- Base assets (SWITTI runs only) ----
pretrained_switti: yresearch/Switti
vae_ckpt: yresearch/VQVAE-Switti

# ---- Models to benchmark ----
runs:

  # ----------------------------------------------------------
  # SWITTI baseline (no control) — AR next-scale model
  # ----------------------------------------------------------
  - name: SWITTI (baseline, no control)
    type: switti
    control_encoder_type: null

  # ----------------------------------------------------------
  # Approach 1 — DINOv2 cross-attention (canny as representative)
  # ----------------------------------------------------------
  - name: Approach 1 (cross-attn, canny)
    type: switti
    modality: canny
    ckpt: /home/woody/iwnt/iwnt134h/switti/tensorboard/train_control_first/local_output_swittiP_vaeP_dinov2b_canny_cross_freeze_v2/model_state_dict.pt
    control_encoder_type: vit
    control_encoder_ckpt: vit_base_patch14_dinov2
    control_context_dim: 384
    control_fusion: cross
    control_pretrained: true

  # ----------------------------------------------------------
  # Approach 1 — DINOv2 additive fusion (canny as representative)
  # ----------------------------------------------------------
  - name: Approach 1 (add, canny)
    type: switti
    modality: canny
    ckpt: /home/woody/iwnt/iwnt134h/switti/tensorboard/train_control_first/local_output_swittiP_vaeP_dinov2b_canny_add_freeze/model_state_dict.pt
    control_encoder_type: vit
    control_encoder_ckpt: vit_base_patch14_dinov2
    control_context_dim: 384
    control_fusion: add
    control_pretrained: true

  # ----------------------------------------------------------
  # Approach 2 — ControlNet-style parallel branch (canny)
  # Uses SwittiControlNet + SwittiControlPipeline (spatial-control-v2.0 branch)
  # ----------------------------------------------------------
  - name: Approach 2 (ControlNet-style, canny)
    type: switti_v2
    modality: canny
    num_modalities: 7
    ckpt: /home/woody/iwnt/iwnt134h/switti/tensorboard/v2.3/local_output_control_canny_zero_init/model_state_dict.pt

  # ----------------------------------------------------------
  # Diffusion baseline: ControlNet + SD 1.5
  # Requires: pip install diffusers accelerate xformers
  # ----------------------------------------------------------
  - name: ControlNet + SD 1.5 (20 steps, UniPC)
    type: controlnet_sd15
    modality: canny
    model_id: runwayml/stable-diffusion-v1-5
    controlnet_id: lllyasviel/sd-controlnet-canny
    num_inference_steps: 20
    scheduler: unipc

  - name: ControlNet + SD 1.5 (50 steps, DDIM)
    type: controlnet_sd15
    modality: canny
    model_id: runwayml/stable-diffusion-v1-5
    controlnet_id: lllyasviel/sd-controlnet-canny
    num_inference_steps: 50
    scheduler: ddim

  # ----------------------------------------------------------
  # Diffusion baseline: ControlNet + SDXL
  # ----------------------------------------------------------
  - name: ControlNet + SDXL (20 steps)
    type: controlnet_sdxl
    modality: canny
    model_id: stabilityai/stable-diffusion-xl-base-1.0
    controlnet_id: diffusers/controlnet-canny-sdxl-1.0
    num_inference_steps: 20

  # ----------------------------------------------------------
  # AR baseline: ControlAR (LlamaGen-XL, text-conditional, 512px)
  # Repo already cloned on cluster; all checkpoints already downloaded.
  # ----------------------------------------------------------
  - name: ControlAR (canny, t2i, 512px)
    type: custom
    wrapper: scripts/wrappers/controlar_wrapper.py
    modality: canny
    controlar_repo: /home/hpc/iwnt/iwnt134h/thesis/repos/ControlAR
    vq_ckpt:      /home/hpc/iwnt/iwnt134h/thesis/repos/ControlAR/checkpoints/vq/vq_ds16_t2i.pt
    gpt_ckpt:     /home/hpc/iwnt/iwnt134h/thesis/repos/ControlAR/checkpoints/llamagen/t2i_XL_stage2_512.pt
    control_ckpt: /home/hpc/iwnt/iwnt134h/thesis/repos/ControlAR/checkpoints/t2i/canny/canny_MR.safetensors
    t5_path:      /home/hpc/iwnt/iwnt134h/thesis/repos/ControlAR/checkpoints/t5-ckpt
    t5_model_type: flan-t5-xl
    image_size: 512
    cls_token_num: 120
    cfg_scale: 7.5
    top_k: 2000
    top_p: 1.0
    temperature: 1.0
    control_strength: 1.0
